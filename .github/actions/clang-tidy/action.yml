name: 'Run clang-tidy'
description: 'Install and run clang-tidy'

runs:
  using: "composite"
  steps:
    - name: Install clang-tidy
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends clang-tidy-${{ env.CLANG_VER }} libc++-${{ env.CLANG_VER }}-dev libc++abi-${{ env.CLANG_VER }}-dev ninja-build libsfml-dev libudev-dev

    - name: Configure CMake
      uses: ./.github/actions/configure-cmake
      with:
        custom_flags: '-GNinja'
        cache_key: 'cache-clang-tidy'

    - name: Clang-Tidy
      continue-on-error: true
      shell: bash
      run: |
        sed -i "s|$(which ${CXX})|$(realpath $(which ${CXX}))|g" "${BUILD_DIR}"/compile_commands.json

        cat "${BUILD_DIR}"/compile_commands.json |
          jq -r '.[] | .file' |
          grep -v "/${BUILD_DIR}/_deps/" |
          grep -v "/${EXT_DIR}/" |
          xargs clang-tidy-${{ env.CLANG_VER }} -p "${BUILD_DIR}"