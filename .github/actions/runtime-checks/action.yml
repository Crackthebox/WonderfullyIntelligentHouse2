name: 'Runtime checks'
description: 'Run dynamic analysis tools'

runs:
  using: "composite"
  steps:
    - name: Sanitizers
      shell: bash
      if: matrix.runs_asan == true && runner.os != 'Windows'
      run: |
        if [[ "${RUNNER_OS}" == "Linux" ]]; then
          # 🔧 REPARAȚIE: xvfb-run este mutat direct în fața executabilului tău
          cat "${INPUT_FILENAME}" | tr -d '\r' | xvfb-run --auto-servernum ./${{ env.ZIP_NAME }}/"${EXECUTABLE_NAME}"
        else
          cat "${INPUT_FILENAME}" | tr -d '\r' | ./${{ env.ZIP_NAME }}/"${EXECUTABLE_NAME}"
        fi

    - name: Sanitizers (Windows MSVC)
      shell: bash
      if: matrix.cxx == 'cl' && matrix.runs_asan == true
      continue-on-error: true
      run: |
        cat "${INPUT_FILENAME}" | ./${{ env.ZIP_NAME }}/"${EXECUTABLE_NAME}".exe

    - name: Valgrind
      shell: bash
      if: runner.os == 'Linux' && matrix.runs_valgrind == true
      run: |
        # 🔧 REPARAȚIE: La fel și pentru Valgrind
        cat "${INPUT_FILENAME}" | tr -d '\r' | xvfb-run --auto-servernum bash ./scripts/run_valgrind.sh "${{ env.ZIP_NAME }}"